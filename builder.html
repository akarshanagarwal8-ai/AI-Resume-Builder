<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resume Builder</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

</head>

<body>

<div class="builder-container">

<div class="form-section">

<h2>Resume Builder</h2>

<input type="text" id="name" placeholder="Full Name">

<input type="email" id="email" placeholder="Email">

<input type="text" id="phone" placeholder="Phone Number">

<input type="text" id="linkedin" placeholder="LinkedIn">

<input type="text" id="github" placeholder="GitHub">

<textarea id="summary" placeholder="Professional Summary"></textarea>

<button onclick="generateSummary()">
Generate AI Summary
</button>

<input type="text" id="college" placeholder="College Name">

<input type="text" id="degree" placeholder="Degree">

<input type="text" id="cgpa" placeholder="CGPA">

<input type="text" id="skills" placeholder="Skills">

<textarea id="projects" placeholder="Projects"></textarea>

<textarea id="certifications" placeholder="Certifications"></textarea>

<input type="file" id="imageUpload">

<div class="template-buttons">

<button onclick="modernTemplate()">Modern</button>

<button onclick="corporateTemplate()">Corporate</button>

<button onclick="creativeTemplate()">Creative</button>

</div>

<button onclick="downloadPDF()">
Download Resume PDF
</button>

<button onclick="toggleDarkMode()">
Toggle Dark Mode
</button>

</div>

<div class="resume-preview" id="resume">

<img id="profilePreview">

<h1 id="previewName">Your Name</h1>

<p id="previewEmail">Email</p>

<p id="previewPhone">Phone</p>

<p id="previewLinkedin">LinkedIn</p>

<p id="previewGithub">GitHub</p>

<h3>Professional Summary</h3>
<p id="previewSummary"></p>

<h3>Education</h3>
<p id="previewEducation"></p>

<h3>Skills</h3>
<p id="previewSkills"></p>

<h3>Projects</h3>
<p id="previewProjects"></p>

<h3>Certifications</h3>
<p id="previewCertifications"></p>

<h3 id="score">
Resume Strength: 85%
</h3>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
